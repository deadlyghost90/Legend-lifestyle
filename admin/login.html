<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f6f7f2">
  <title>Admin sign in — Legend Lifestyle</title>
  <style>
    :root{color-scheme:light;--ink:#20221d;--muted:#73776d;--line:#e5e7df;--paper:#f6f7f2;--lime:#d8ff69}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 15% 10%,#e8edda 0,transparent 42%),var(--paper);color:var(--ink);font:14px/1.5 Inter,"DM Sans",Arial,sans-serif;padding:22px}
    .card{width:min(100%,430px);background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:0 24px 80px #20221d0c}
    .brand{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.12em;margin-bottom:32px}.mark{width:34px;height:34px;display:grid;place-items:center;background:var(--ink);color:var(--lime);border-radius:50%;font:24px Georgia}
    .eyebrow{font-size:10px;letter-spacing:.16em;font-weight:800;color:var(--muted)}h1{font-size:29px;letter-spacing:-.055em;margin:8px 0}p{color:var(--muted);font-size:12px}.field{display:block;margin:18px 0 0;font-size:11px;font-weight:700}.field input{display:block;width:100%;padding:13px;margin-top:7px;border:1px solid var(--line);border-radius:7px;background:#fcfcfa;font:inherit;color:var(--ink)}.field input:focus{outline:2px solid #a4bf5d;outline-offset:1px}
    button{width:100%;margin-top:22px;padding:13px 16px;border:0;border-radius:7px;background:var(--ink);color:#fff;font:inherit;font-size:12px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.notice{padding:12px;border-radius:8px;background:#f3f5ed;color:#555a4b;font-size:11px;margin-top:18px}.error{background:#fff0ec;color:#8a3528}.back{display:inline-block;margin-top:20px;color:var(--ink);font-size:11px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark">L</span><span>LEGEND LIFESTYLE <span style="color:#888;font-size:9px">/ ADMIN</span></span></div>
    <span class="eyebrow">SECURE STORE WORKSPACE</span>
    <h1>Sign in to your store.</h1>
    <p>Use an account created in your configured Supabase Auth project. Access is granted only to accounts with a trusted admin role.</p>
    <form id="loginForm">
      <label class="field">Email address<input id="email" type="email" autocomplete="username" required maxlength="254" placeholder="admin@yourstore.com"></label>
      <label class="field">Password<input id="password" type="password" autocomplete="current-password" required minlength="1" maxlength="256" placeholder="Your password"></label>
      <button id="submitButton" type="submit">Sign in securely</button>
    </form>
    <div id="notice" class="notice" role="status">Checking configuration…</div>
    <a class="back" href="../index.html">← Back to storefront</a>
  </main>
  <script src="admin-config.js"></script>
  <script type="module">
    const config = window.LEGEND_SUPABASE_CONFIG || {};
    const form = document.querySelector("#loginForm");
    const button = document.querySelector("#submitButton");
    const notice = document.querySelector("#notice");
    const setNotice = (message, error = false) => { notice.textContent = message; notice.classList.toggle("error", error); };
    if (!config.url || !config.anonKey) {
      button.disabled = true;
      setNotice("Setup required: add your Supabase project URL and public anon key in admin/admin-config.js, then configure the server environment variables in Vercel.", true);
    } else {
      try {
        const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
        const client = createClient(config.url, config.anonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
        setNotice("Sign in with the admin account you created in Supabase Auth.");
        form.addEventListener("submit", async event => {
          event.preventDefault();
          button.disabled = true;
          button.textContent = "Signing in…";
          setNotice("Verifying credentials…");
          try {
            const { error } = await client.auth.signInWithPassword({
              email: document.querySelector("#email").value.trim(),
              password: document.querySelector("#password").value
            });
            if (error) throw error;
            window.location.replace("index.html");
          } catch (error) {
            setNotice(error?.message || "Sign in failed. Check your credentials and try again.", true);
            button.disabled = false;
            button.textContent = "Sign in securely";
          }
        });
      } catch {
        button.disabled = true;
        setNotice("Could not load the authentication client. Check your network connection and Supabase configuration.", true);
      }
    }
  </script>
</body>
</html>
