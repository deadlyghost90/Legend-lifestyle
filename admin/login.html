<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f6f7f2"><title>Admin sign in — Legend Lifestyle</title>
<style>:root{color-scheme:light;--ink:#20221d;--muted:#73776d;--line:#e5e7df;--paper:#f6f7f2;--lime:#d8ff69}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 15% 10%,#e8edda 0,transparent 42%),var(--paper);color:var(--ink);font:14px/1.5 Inter,"DM Sans",Arial,sans-serif;padding:22px}.card{width:min(100%,430px);background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:0 24px 80px #20221d0c}.brand{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.12em;margin-bottom:32px}.mark{width:34px;height:34px;display:grid;place-items:center;background:var(--ink);color:var(--lime);border-radius:50%;font:24px Georgia}.eyebrow{font-size:10px;letter-spacing:.16em;font-weight:800;color:var(--muted)}h1{font-size:29px;letter-spacing:-.055em;margin:8px 0}p{color:var(--muted);font-size:12px}.field{display:block;margin:18px 0 0;font-size:11px;font-weight:700}.field input{display:block;width:100%;padding:13px;margin-top:7px;border:1px solid var(--line);border-radius:7px;background:#fcfcfa;font:inherit;color:var(--ink)}button{width:100%;margin-top:22px;padding:13px 16px;border:0;border-radius:7px;background:var(--ink);color:#fff;font:inherit;font-size:12px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.notice{padding:12px;border-radius:8px;background:#f3f5ed;color:#555a4b;font-size:11px;margin-top:18px}.error{background:#fff0ec;color:#8a3528}.back{display:inline-block;margin-top:20px;color:var(--ink);font-size:11px}</style></head>
<body><main class="card"><div class="brand"><span class="mark">L</span><span>LEGEND LIFESTYLE <span style="color:#888;font-size:9px">/ ADMIN</span></span></div><span class="eyebrow">SECURE STORE WORKSPACE</span><h1>Sign in to your store.</h1><p>Sign in with a Firebase Authentication account that has the trusted admin custom claim. Store access is enforced by Realtime Database security rules.</p>
<form id="loginForm"><label class="field">Email address<input id="email" type="email" autocomplete="username" required maxlength="254" placeholder="admin@yourstore.com"></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="Your password"></label><button id="submitButton" type="submit">Sign in securely</button></form><div id="notice" class="notice" role="status">Checking Firebase configuration…</div><a class="back" href="../index.html">← Back to storefront</a></main>
<script src="../firebase-config.js"></script><script type="module">
const config=window.LEGEND_FIREBASE_CONFIG||{};const form=document.querySelector("#loginForm");const button=document.querySelector("#submitButton");const notice=document.querySelector("#notice");const setNotice=(message,error=false)=>{notice.textContent=message;notice.classList.toggle("error",error)};
if(!config.apiKey||!config.databaseURL||!config.projectId){button.disabled=true;setNotice("Firebase setup is incomplete. Check firebase-config.js.",true)}else{try{const appSdk=await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js");const authSdk=await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js");const app=appSdk.getApps().length?appSdk.getApp():appSdk.initializeApp(config);const auth=authSdk.getAuth(app);setNotice("Sign in with your Firebase Authentication admin account.");form.addEventListener("submit",async event=>{event.preventDefault();button.disabled=true;button.textContent="Signing in…";try{const cred=await authSdk.signInWithEmailAndPassword(auth,document.querySelector("#email").value.trim(),document.querySelector("#password").value);const token=await authSdk.getIdTokenResult(cred.user,true);if(token.claims.admin!==true){await authSdk.signOut(auth);throw new Error("This account is not authorized as a store admin.")}window.location.replace("index.html")}catch(error){setNotice(error.message||"Sign-in failed. Check your credentials.",true);button.disabled=false;button.textContent="Sign in securely"}})}catch(error){button.disabled=true;setNotice("Could not load Firebase SDK. Check your network and configuration.",true)}}</script></body></html>
